name: Veille quotidienne
 
on:
  schedule:
    # 06:00 UTC = 07:00 ou 08:00 heure de Paris selon la saison
    - cron: '0 6 * * *'
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  veille:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - run: npm install
 
      - run: npm test
 
      - name: Lancer la veille
        run: npm run scrape
 
      - name: Publier les nouvelles annonces si besoin
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle annonce aujourd'hui."
          else
            git commit -m "Veille $(date -u +%Y-%m-%d)"
            git push
          fi
 
